[package]
name = "gribify"
version = "0.1.0-rc.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_gribify"
crate-type = ["cdylib"]

[dependencies]
grib = { version = "0.21.0", default-features = false }
pyo3 = { version = "0.30", features = ["experimental-inspect", "abi3-py311"] }
numpy = "0.30"
