site_name: gribify
site_description: Generate GRIB2 data from Python
use_directory_urls: false
nav:
  - Home: index.md
  - Examples: examples.md
  - API reference: api.md
  - Development:
      - Building the library: development/building.md
      - Building the docs: development/docs.md
theme:
  name: readthedocs
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_signature_annotations: true
            show_source: false
            show_root_heading: true
            heading_level: 2
markdown_extensions:
  - admonition
