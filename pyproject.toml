[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "gribify"
dependencies = [
    "numpy>=1.24.4",
]
requires-python = ">=3.11"
authors = [
  { name = "Noritada Kobayashi", email = "noritada.kobayashi@gmail.com" },
]
description = "GRIB2 format writer"
license = "Apache-2.0"
license-files = ["LICENSE-*"]
keywords = ["GRIB", "weather", "meteorology", "data format"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/noritada/gribify"

[tool.maturin]
module-name = "gribify._gribify"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.30,<1",
    # mkdocstrings 0.30 uses the pre-12 Highlight constructor.
    "pymdown-extensions>=10,<12",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11" }
