[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "gribify"
dependencies = [
    "numpy>=1.24.4",
]
requires-python = ">=3.11"
authors = [
  { name = "Noritada Kobayashi", email = "noritada.kobayashi@gmail.com" },
]
description = "GRIB2 format writer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE-*"]
keywords = ["GRIB", "weather", "meteorology", "data format"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/noritada/gribify"
Documentation = "https://noritada.github.io/gribify/"
Issues = "https://github.com/noritada/gribify/issues"

[tool.maturin]
module-name = "gribify._gribify"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.30,<1",
    # mkdocstrings 0.30 uses the pre-12 Highlight constructor.
    "pymdown-extensions>=10,<12",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11" }
