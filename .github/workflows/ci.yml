# Build CPython 3.11+ abi3, version-specific 3.14t, and CPython 3.15+ abi3t wheels.
# 3.13t is excluded because PyO3 0.30 rejects free-threaded CPython < 3.14.
# Build abi3t separately from abi3 and test the same abi3t wheel on both
# GIL-enabled and free-threaded CPython 3.15.
# Test the same wheel on each supported CPython minor version.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # Select interpreters inside the build container, not on the runner.
          args: >-
            --release --out dist
            --interpreter python3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # Select interpreters inside the build container, not on the runner.
          args: >-
            --release --out dist
            --interpreter python3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python311
        with:
          python-version: "3.11"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release --out dist
            --interpreter
            "${{ steps.python311.outputs.python-path }}"
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python311
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release --out dist
            --interpreter
            "${{ steps.python311.outputs.python-path }}"
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  test-wheels:
    name: Test wheel (${{ matrix.platform.artifact }}, Python ${{ matrix.python }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # Run natively where hosted runners are available. Other Linux targets
        # are cross-built above but are not executed by this test job.
        platform:
          - runner: ubuntu-22.04
            artifact: wheels-linux-x86_64
            python_arch: x64
          - runner: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
            python_arch: arm64
          - runner: windows-latest
            artifact: wheels-windows-x64
            python_arch: x64
          - runner: windows-latest
            artifact: wheels-windows-x86
            python_arch: x86
          - runner: windows-11-arm
            artifact: wheels-windows-aarch64
            python_arch: arm64
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64
            python_arch: x64
          - runner: macos-latest
            artifact: wheels-macos-aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.python_arch }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      - name: Install the built abi3 wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          assert "-cp311-abi3-" in wheels[0].name, wheels[0]
          subprocess.run(
              [sys.executable, "-m", "pip", "install", str(wheels[0])],
              check=True,
          )
      - name: Test the installed wheel
        run: python -I -m unittest discover -s tests -v

  free-threaded:
    name: Free-threaded (${{ matrix.platform.name }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PyO3 0.30 does not support 3.13t; abi3t starts at 3.15.
        # Only the 3.15 build enables abi3t; 3.14t remains version-specific.
        python: ["3.14", "3.15"]
        # Use native 64-bit runners and PyPA containers for Linux builds.
        # Test glibc wheels on the runner (recent NumPy wheels need newer
        # glibc than the build image); test musl wheels inside their image.
        # The existing 32-bit and other cross-built targets retain abi3 only.
        platform:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            python_arch: x64
            manylinux: "2014"
            container: quay.io/pypa/manylinux2014_x86_64:latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            python_arch: arm64
            manylinux: "2014"
            container: quay.io/pypa/manylinux2014_aarch64:latest
          - name: musllinux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            python_arch: x64
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            python_arch: arm64
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64:latest
          - name: windows-x64
            runner: windows-latest
            target: x64
            python_arch: x64
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64
            python_arch: arm64
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            python_arch: x64
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !startsWith(matrix.platform.name, 'musllinux-') }}
        id: python
        with:
          python-version: ${{ matrix.python }}t
          architecture: ${{ matrix.platform.python_arch }}
      - name: Select interpreter
        id: interpreter
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            tag="cp${PYTHON_VERSION//./}"
            echo "path=/opt/python/${tag}-${tag}t/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "path=$NATIVE_PYTHON" >> "$GITHUB_OUTPUT"
          fi
      - name: Build free-threaded wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
          args: >-
            --release --out dist
            --interpreter "${{ steps.interpreter.outputs.path }}"
            ${{ matrix.python == '3.15' && '--features pyo3/abi3t-py315' || '' }}
          # The native PyPA musllinux images cannot install the sccache
          # wheels used by maturin-action (no matching musllinux wheels).
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(matrix.platform.name, 'musllinux-') }}
      - name: Test free-threaded wheel (musllinux container)
        if: startsWith(matrix.platform.name, 'musllinux-')
        env:
          BUILD_CONTAINER: ${{ matrix.platform.container }}
          TEST_PYTHON: ${{ steps.interpreter.outputs.path }}
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/io" --workdir /io \
            "$BUILD_CONTAINER" "$TEST_PYTHON" -I .github/scripts/test_free_threaded_wheel.py
      - name: Test free-threaded wheel (native runner)
        if: ${{ !startsWith(matrix.platform.name, 'musllinux-') }}
        shell: bash
        env:
          # Keep using the selected interpreter even if the build changes PATH.
          TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$TEST_PYTHON" -I .github/scripts/test_free_threaded_wheel.py'
      - uses: actions/setup-python@v7
        if: ${{ matrix.python == '3.15' && !startsWith(matrix.platform.name, 'musllinux-') }}
        id: python-gil
        with:
          python-version: "3.15"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Test the same abi3t wheel with the GIL (native runner)
        if: ${{ matrix.python == '3.15' && !startsWith(matrix.platform.name, 'musllinux-') }}
        shell: bash
        env:
          TEST_PYTHON: ${{ steps.python-gil.outputs.python-path }}
        run: '"$TEST_PYTHON" -I .github/scripts/test_free_threaded_wheel.py --gil-enabled'
      - name: Test the same abi3t wheel with the GIL (musllinux container)
        if: matrix.python == '3.15' && startsWith(matrix.platform.name, 'musllinux-')
        env:
          BUILD_CONTAINER: ${{ matrix.platform.container }}
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/io" --workdir /io \
            "$BUILD_CONTAINER" /opt/python/cp315-cp315/bin/python -I \
            .github/scripts/test_free_threaded_wheel.py --gil-enabled
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-free-threaded-${{ matrix.platform.name }}-${{ matrix.python }}t
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist, test-wheels, free-threaded]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v10.3.3
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
